<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>Jarvis Pet · 앱 안내</title><link rel="stylesheet" href="prompt.css"></head>
<body><main>
<header><p class="eyebrow">JARVIS PET · 앱 안내</p><h1>작은 시간 약속</h1><p>알은 조용히 곁에 있고, 시간은 앱이 챙깁니다.</p></header>
<form id="timer-form"><label for="request">요청</label><input id="request" maxlength="80" autocomplete="off" placeholder="5분 타이머" aria-describedby="hint result">
<p id="hint">지금은 5분 타이머 하나를 사용할 수 있습니다.</p>
<div class="actions"><button id="submit" type="submit">등록</button><button id="close" type="button" class="secondary">닫기 / 취소</button></div></form>
<p id="result" role="status" aria-live="polite">입력한 뒤 Enter로 등록하세요. Esc는 입력을 취소합니다.</p>
<section aria-labelledby="list-title"><h2 id="list-title">타이머</h2><div id="timers"></div></section>
<footer>앱을 완전히 종료하거나 컴퓨터가 잠들면 정시 알림을 보장하지 않습니다. 다시 열면 지난 타이머를 여기에서 확인할 수 있습니다.</footer>
</main><script src="prompt.js"></script></body></html>
