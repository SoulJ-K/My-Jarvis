<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Jarvis Pet · 임시 알</title>
    <link rel="stylesheet" href="styles.css">
    <script src="pet.js" defer></script>
  </head>
  <body>
    <main aria-label="Jarvis Pet 임시 알">
      <div class="shadow" aria-hidden="true"></div>
      <button id="egg" title="클릭: 반응 · 드래그: 이동 · 잠깐 누른 뒤 좌우 문지르기: 쓰다듬기" aria-label="임시 알. 클릭하면 반응하고, 드래그하면 이동합니다. 잠깐 누른 뒤 밝아지면 좌우로 문지르면 쓰다듬습니다.">
        <span class="shell" aria-hidden="true"></span>
        <span id="sleep-symbol" hidden aria-hidden="true">zZ</span>
        <span id="emotion-orb" hidden aria-hidden="true"></span>
        <span id="pet-name" aria-hidden="true"></span>
      </button>
    <button id="food" hidden title="아기 근처로 끌어 주세요. 클릭해도 놓을 수 있어요." aria-label="먹이. 아기 근처로 끌거나 클릭해서 놓기"><span aria-hidden="true"></span></button>
    <p id="save-status" role="status"></p>
    </main>
  </body>
</html>
